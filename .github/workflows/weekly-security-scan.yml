name: Weekly & Manual OWASP ZAP Security Scan

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:
    inputs:
      target:
        description: 'Target URL to scan (leave blank to use PRODUCTION_URL variable)'
        required: false
        type: string

permissions:
  contents: read
  issues: write # Required for ZAP to open GitHub issues for detected vulnerabilities
  security-events: write # Required for Snyk SARIF upload to GitHub Security tab

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan target URL
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Full history required for TruffleHog

      - name: TruffleHog Full History Scan
        uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          extra_args: --only-verified

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Snyk Weekly Dependency Scan
        uses: snyk/actions/node@8e119fbb6c251787721d34ba683ed48eba792766 # master @ 2026-05-27
        continue-on-error: true # Report only — do not block the ZAP scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Snyk Code Weekly Scan
        uses: snyk/actions/node@8e119fbb6c251787721d34ba683ed48eba792766 # master @ 2026-05-27
        continue-on-error: true # Report only — catches new SAST rules published since last deploy
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high --include-ignores

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ github.event.inputs.target || vars.PRODUCTION_URL }}
          rules_file_name: '.zap/rules.tsv'
          fail_action: false # Do not fail the GitHub Actions runner itself, just create issues
