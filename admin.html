<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Admin - Lorena & Marcelo</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { background-color: #f1f5f9; }
      .admin-container {
        max-width: 800px;
        margin: 4rem auto;
        padding: 2rem;
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
      }
      .admin-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 2rem;
      }
      .admin-table th, .admin-table td {
        padding: 1rem;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
      }
      .status-badge {
        padding: 0.25rem 0.5rem;
        border-radius: var(--radius-full);
        font-size: 0.875rem;
        font-weight: 600;
      }
      .status-pending { background: #fef08a; color: #854d0e; }
      .status-approved { background: #bbf7d0; color: #166534; }
      .status-rejected { background: #fecaca; color: #991b1b; }
      
      #login-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 4rem 0;
      }
    </style>
  </head>
  <body>
    <div class="admin-container">
      <div id="login-screen">
        <h2>Painel de Controle</h2>
        <p>Acesso Restrito Aos Noivos</p>
        <input type="password" id="admin-pwd" placeholder="Senha" style="padding: 0.5rem; width: 250px; border: 1px solid #ccc;" />
        <button class="btn btn-primary" onclick="adminApp.login()">Entrar</button>
      </div>

      <div id="dashboard-screen" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2>Painel de Validação (PIX)</h2>
          <button class="btn btn-secondary btn-sm" onclick="adminApp.logout()">Sair</button>
        </div>
        
        <p style="margin-top: 1rem; color: var(--color-text-muted);">
          Aprove transações apenas quando o dinheiro cair na conta. Rejeitar removerá os pontos do placar.
        </p>

        <table class="admin-table">
          <thead>
            <tr>
              <th>Convidado</th>
              <th>Valor (R$)</th>
              <th>Lista</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="admin-table-body">
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <script type="module" src="./admin.js"></script>
  </body>
</html>
