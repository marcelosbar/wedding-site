# SonarCloud Project Configuration
# Substitua as chaves abaixo com as informações do seu projeto no SonarCloud

sonar.projectKey=wedding-site
sonar.organization=SEU_NOME_DE_ORGANIZACAO_AQUI

# Pastas e arquivos de código-fonte
sonar.sources=.

# Ignorar pastas de build, testes e configurações para a análise
sonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.test.js,vite.config.js,firebase.json,.github/**,*.md

# Caminho para o relatório de cobertura gerado pelo Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
